[build]
  command = "npm run build"
  publish = "dist"

# If you deploy your backend (Render/Railway/Fly.io), uncomment and replace the URL below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
